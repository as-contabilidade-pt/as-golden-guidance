name: Tarefa diária do portal

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  chamar:
    runs-on: ubuntu-latest
    steps:
      # Mantém a base de dados ativa mesmo que o site esteja indisponível.
      # O URL e a chave pública (publishable) são os mesmos que o site já expõe aos browsers.
      - name: Manter a base de dados ativa
        env:
          SUPABASE_URL: https://dwtofbbzjsgndtloeqas.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_rZqrC9fksuMfZ1YPXX-Ixg_6rAuKHeP
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" || true)
          echo "Base de dados: HTTP $status"
          [ "$status" = "200" ] || exit 22

      - name: Chamar o endpoint diário
        if: always()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 15 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/public/jobs/vercel" || true)
          echo "Site: HTTP $status"
          [ "$status" = "200" ] || exit 22
          echo "Tarefa diária concluída"

name: Tarefa diária do portal

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  chamar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endpoint diário
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/public/jobs/vercel" -o /dev/null
          echo "Tarefa diária concluída"

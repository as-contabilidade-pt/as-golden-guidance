name: Tarefa diária do portal

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  chamar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endpoint diário
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Diagnóstico sem revelar o valor: comprimento e caracteres que o servidor recusa.
          printf 'CRON_SECRET: comprimento=%s\n' "${#CRON_SECRET}"
          if printf '%s' "$CRON_SECRET" | grep -q '[[:space:],]'; then echo "AVISO: o segredo tem espaços, vírgulas ou quebras de linha; o servidor recusa-os."; else echo "Formato do segredo: ok"; fi
          printf 'SITE_URL: comprimento=%s\n' "${#SITE_URL}"
          if printf '%s' "$SITE_URL" | grep -q '[[:space:]]$\|/$'; then echo "AVISO: SITE_URL termina em espaço ou barra."; else echo "Formato do SITE_URL: ok"; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/public/jobs/vercel" -o /dev/null
          echo "Tarefa diária concluída"
